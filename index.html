<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🚀 Login Tester Pro Max</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-orange: #ff6b00;
            --neon-yellow: #ffd700;
            --neon-blue: #00d4ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff88;
            --dark-bg: #0a0a0f;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            position: relative;
        }

        /* ===== ANIMATED BG ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 107, 0, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 212, 255, 0.08) 0%, transparent 50%);
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ===== PARTICLES ===== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            animation: float linear infinite;
            opacity: 0.3;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* ===== CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 45px 40px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 10px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #0a0a0f;
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.3);
            animation: logoGlow 2s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 107, 0, 0.3); }
            50% { box-shadow: 0 0 80px rgba(255, 107, 0, 0.6); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .badge-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 107, 0, 0.3);
            background: rgba(255, 107, 0, 0.1);
            color: var(--neon-orange);
            font-family: monospace;
        }

        .badge.blue {
            border-color: rgba(0, 212, 255, 0.3);
            background: rgba(0, 212, 255, 0.1);
            color: var(--neon-blue);
        }

        /* ===== SUBTITLE BAR ===== */
        .subtitle-bar {
            text-align: center;
            padding: 15px 0 25px 0;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .subtitle-bar span {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
        }

        .subtitle-bar i {
            color: var(--neon-orange);
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--neon-green);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* ===== INPUT SECTION ===== */
        .input-section {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 28px 30px;
            margin-bottom: 25px;
            border: 1px solid var(--glass-border);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group label i {
            color: var(--neon-orange);
        }

        .url-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .url-wrapper input {
            flex: 1;
            min-width: 220px;
            padding: 16px 22px;
            border-radius: 60px;
            border: 2px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .url-wrapper input:focus {
            border-color: var(--neon-orange);
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.1);
        }

        .url-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Segoe UI', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-orange), var(--neon-yellow));
            color: #0a0a0f;
            box-shadow: 0 8px 30px rgba(255, 107, 0, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255, 107, 0, 0.5);
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            font-size: 0.8rem;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-sm:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ===== OPTIONS ===== */
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--glass-border);
            align-items: center;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px 6px 10px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
        }

        .option-item label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .option-item select {
            padding: 5px 10px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
            font-family: monospace;
        }

        .option-item select:focus {
            border-color: var(--neon-orange);
        }

        .option-item select option {
            background: #1a1a2e;
        }

        .toggle-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .toggle-wrap input[type="checkbox"] {
            appearance: none;
            width: 36px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .toggle-wrap input[type="checkbox"]::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .toggle-wrap input[type="checkbox"]:checked {
            background: var(--neon-orange);
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.3);
        }

        .toggle-wrap input[type="checkbox"]:checked::before {
            left: 18px;
        }

        .toggle-wrap span {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        /* ===== RESULT AREA ===== */
        .result-area {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            margin-top: 20px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 22px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid var(--glass-border);
        }

        .result-header .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .result-header .left h3 {
            font-size: 0.85rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-header .left h3 i {
            color: var(--neon-orange);
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 5px 16px;
            border-radius: 40px;
            font-weight: 700;
            border: 1px solid var(--glass-border);
            transition: all 0.3s;
        }

        .status-badge.idle {
            color: rgba(255, 255, 255, 0.3);
        }

        .status-badge.loading {
            color: var(--neon-yellow);
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.05);
            animation: pulse 0.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .status-badge.success {
            color: var(--neon-green);
            border-color: rgba(0, 255, 136, 0.3);
            background: rgba(0, 255, 136, 0.05);
        }

        .status-badge.error {
            color: #ff0040;
            border-color: rgba(255, 0, 64, 0.3);
            background: rgba(255, 0, 64, 0.05);
        }

        .result-header .right {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* ===== RESULT CONTENT ===== */
        #resultContent {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            padding: 20px 24px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 450px;
            overflow-y: auto;
            color: #c8c8c8;
            line-height: 1.7;
            min-height: 120px;
            background: rgba(0, 0, 0, 0.2);
        }

        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100px;
            color: rgba(255, 255, 255, 0.1);
            gap: 10px;
        }

        .placeholder i {
            font-size: 2.5rem;
        }

        .placeholder span {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.85rem;
        }

        .line-num {
            display: inline-block;
            width: 40px;
            color: rgba(255, 255, 255, 0.1);
            user-select: none;
            font-size: 0.65rem;
        }

        .hl-success { color: var(--neon-green); }
        .hl-error { color: #ff0040; }
        .hl-warning { color: var(--neon-yellow); }
        .hl-info { color: var(--neon-blue); }
        .hl-primary { color: var(--neon-orange); }

        /* ===== STATS ===== */
        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            padding: 12px 22px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--glass-border);
            font-size: 0.7rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
        }

        .stat-item i {
            color: var(--neon-orange);
        }

        .stat-item .val {
            color: #fff;
            font-weight: 700;
            font-family: monospace;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }

        .toast {
            padding: 14px 22px;
            border-radius: 16px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: #fff;
            font-weight: 500;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast i { font-size: 1.2rem; }
        .toast.success i { color: var(--neon-green); }
        .toast.error i { color: #ff0040; }
        .toast.warning i { color: var(--neon-yellow); }
        .toast.info i { color: var(--neon-blue); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container { padding: 25px 16px; }
            h1 { font-size: 1.5rem; }
            .logo-icon { width: 48px; height: 48px; font-size: 22px; }
            .url-wrapper { flex-direction: column; }
            .url-wrapper input { width: 100%; min-width: unset; }
            .btn-primary { width: 100%; justify-content: center; }
            .options-grid { flex-direction: column; align-items: stretch; }
            .option-item { justify-content: space-between; }
            .result-header { flex-direction: column; align-items: flex-start; }
            .result-header .right { width: 100%; justify-content: flex-start; }
            .stats-grid { flex-direction: column; gap: 6px; }
            .toast-container { left: 20px; right: 20px; bottom: 20px; }
            .header { flex-direction: column; align-items: flex-start; }
        }

        @media (max-width: 480px) {
            .container { padding: 16px 10px; border-radius: 16px; }
            .input-section { padding: 16px 12px; }
            .btn { padding: 12px 16px; font-size: 0.8rem; }
            #resultContent { font-size: 0.7rem; padding: 14px; max-height: 300px; }
        }
    </style>
</head>
<body>

    <!-- ===== PARTICLES ===== -->
    <div class="particles" id="particles"></div>

    <!-- ===== MAIN ===== -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-section">
                <div class="logo-icon"><i class="fas fa-rocket"></i></div>
                <div>
                    <h1>Login Tester</h1>
                    <div class="subtitle"><i class="fas fa-bolt"></i> Next Generation</div>
                </div>
            </div>
            <div class="badge-group">
                <span class="badge"><i class="fas fa-code"></i> v4.0</span>
                <span class="badge blue"><i class="fas fa-bolt"></i> Offline Ready</span>
            </div>
        </div>

        <!-- Subtitle -->
        <div class="subtitle-bar">
            <span class="dot"></span>
            <span><i class="fas fa-link"></i> لینکی لۆگین پەیج بنێرە، کۆدەکە ریکوێستێک دروست دەکات</span>
            <span class="badge" style="font-size:0.55rem;"><i class="fas fa-clock"></i> Real-time</span>
        </div>

        <!-- Input -->
        <div class="input-section">
            <div class="input-group">
                <label for="urlInput"><i class="fas fa-globe"></i> لینکی لاپەڕەی لۆگین</label>
                <div class="url-wrapper">
                    <input type="url" id="urlInput" placeholder="https://example.com/login" value="https://example.com/login" />
                    <button class="btn btn-primary" id="sendBtn"><i class="fas fa-paper-plane"></i> ناردن</button>
                </div>
            </div>

            <!-- Options -->
            <div class="options-grid">
                <div class="option-item">
                    <label><i class="fas fa-code-branch"></i> مێسۆد</label>
                    <select id="methodSelect">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                        <option value="PATCH">PATCH</option>
                        <option value="HEAD">HEAD</option>
                    </select>
                </div>

                <div class="option-item">
                    <label><i class="fas fa-flag"></i> ڕیدایرێکت</label>
                    <select id="redirectSelect">
                        <option value="follow">Follow</option>
                        <option value="error">Error</option>
                        <option value="manual">Manual</option>
                    </select>
                </div>

                <div class="option-item">
                    <label class="toggle-wrap">
                        <input type="checkbox" id="showHeaders" />
                        <span><i class="fas fa-headers"></i> هێدەر</span>
                    </label>
                </div>

                <div class="option-item">
                    <label class="toggle-wrap">
                        <input type="checkbox" id="showFullHtml" />
                        <span><i class="fas fa-file-code"></i> HTML تەواو</span>
                    </label>
                </div>

                <div class="option-item" style="border:none;background:none;padding:0;">
                    <button class="btn btn-glass" id="clearBtn"><i class="fas fa-eraser"></i> پاککردنەوە</button>
                    <button class="btn btn-glass" id="exampleBtn"><i class="fas fa-list"></i> نموونە</button>
                </div>
            </div>
        </div>

        <!-- Result -->
        <div class="result-area">
            <div class="result-header">
                <div class="left">
                    <h3><i class="fas fa-terminal"></i> ئەنجام</h3>
                    <span class="status-badge idle" id="statusBadge"><i class="fas fa-circle" style="font-size:0.3rem;margin-left:6px;"></i> چاوەڕوانی</span>
                </div>
                <div class="right">
                    <button class="btn-sm" id="copyBtn"><i class="fas fa-copy"></i> کۆپی</button>
                    <button class="btn-sm" id="copyCurlBtn"><i class="fas fa-terminal"></i> CURL</button>
                    <button class="btn-sm" id="exportBtn"><i class="fas fa-download"></i> هەناردە</button>
                    <button class="btn-sm" id="clearResultBtn"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <div id="resultContent">
                <div class="placeholder">
                    <i class="fas fa-robot"></i>
                    <span>ئەنجامی داواکاری لێرە دەردەکەوێت</span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-item"><i class="fas fa-hourglass-half"></i> کاتی وەڵام: <span class="val" id="respTime">—</span></div>
                <div class="stat-item"><i class="fas fa-weight-hanging"></i> قەبارە: <span class="val" id="respSize">—</span></div>
                <div class="stat-item"><i class="fas fa-code"></i> ستاتەس: <span class="val" id="respStatus">—</span></div>
                <div class="stat-item"><i class="fas fa-fingerprint"></i> براوزەر: <span class="val" id="respAgent">—</span></div>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ===== PARTICLES =====
            (function createParticles() {
                const container = document.getElementById('particles');
                const colors = ['#ff6b00', '#ffd700', '#00d4ff', '#ff00ff', '#00ff88'];
                for (let i = 0; i < 40; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDuration = (Math.random() * 15 + 10) + 's';
                    p.style.animationDelay = (Math.random() * 10) + 's';
                    p.style.width = (Math.random() * 4 + 2) + 'px';
                    p.style.height = p.style.width;
                    p.style.background = colors[Math.floor(Math.random() * colors.length)];
                    p.style.boxShadow = `0 0 ${Math.random() * 15 + 5}px ${p.style.background}`;
                    container.appendChild(p);
                }
            })();

            // ===== DOM REFS =====
            const urlInput = document.getElementById('urlInput');
            const sendBtn = document.getElementById('sendBtn');
            const resultContent = document.getElementById('resultContent');
            const statusBadge = document.getElementById('statusBadge');
            const methodSelect = document.getElementById('methodSelect');
            const redirectSelect = document.getElementById('redirectSelect');
            const showHeadersCheck = document.getElementById('showHeaders');
            const showFullHtmlCheck = document.getElementById('showFullHtml');
            const respTime = document.getElementById('respTime');
            const respSize = document.getElementById('respSize');
            const respStatus = document.getElementById('respStatus');
            const respAgent = document.getElementById('respAgent');

            // ===== STATE =====
            let lastResponse = null;
            let lastUrl = '';
            let lastMethod = 'GET';
            let lastHeaders = {};

            // ===== TOAST =====
            function showToast(msg, type = 'info', duration = 3000) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-times-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };
                toast.className = `toast ${type}`;
                toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${msg}</span>`;
                container.appendChild(toast);
                requestAnimationFrame(() => toast.classList.add('show'));
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 500);
                }, duration);
            }

            // ===== SET BADGE =====
            function setBadge(text, type = 'idle') {
                const icons = {
                    idle: 'fa-circle',
                    loading: 'fa-spinner fa-spin',
                    success: 'fa-check-circle',
                    error: 'fa-times-circle',
                    warning: 'fa-exclamation-triangle'
                };
                statusBadge.innerHTML =
                    `<i class="fas ${icons[type] || icons.idle}" style="font-size:0.3rem;margin-left:6px;"></i> ${text}`;
                statusBadge.className = `status-badge ${type}`;
            }

            // ===== SET RESULT =====
            function setResult(text, isError = false) {
                if (!text || text.trim() === '') {
                    resultContent.innerHTML = `
                        <div class="placeholder">
                            <i class="fas fa-robot"></i>
                            <span>ئەنجامی داواکاری لێرە دەردەکەوێت</span>
                        </div>
                    `;
                    return;
                }

                let html = '';
                const lines = text.split('\n');
                lines.forEach((line, idx) => {
                    let cls = '';
                    if (line.includes('[ERROR]') || line.includes('[ERR]')) cls = 'hl-error';
                    else if (line.includes('[WARN]')) cls = 'hl-warning';
                    else if (line.includes('[INFO]')) cls = 'hl-info';
                    else if (line.includes('[OK]') || line.includes('[SUCCESS]')) cls = 'hl-success';
                    else if (line.includes('[HEADER]')) cls = 'hl-primary';
                    const escaped = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    html += `<div class="${cls}"><span class="line-num">${String(idx + 1).padStart(3, ' ')}</span>${escaped}</div>`;
                });
                resultContent.innerHTML = html;
                resultContent.scrollTop = 0;
            }

            // ===== UPDATE STATS =====
            function updateStats(status, size, time, agent) {
                respStatus.textContent = status || '—';
                respSize.textContent = size ? formatBytes(size) : '—';
                respTime.textContent = time ? `${time}ms` : '—';
                respAgent.textContent = agent || navigator.userAgent.substring(0, 35) + '...';
            }

            function formatBytes(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            // ===== GENERATE CURL =====
            function generateCurl(url, method, headers, body) {
                let curl = `curl -X ${method} '${url}'`;
                if (headers) {
                    Object.keys(headers).forEach(key => {
                        if (!['content-length', 'host'].includes(key.toLowerCase())) {
                            curl += ` \\\n  -H '${key}: ${headers[key]}'`;
                        }
                    });
                }
                if (body && ['POST', 'PUT', 'PATCH'].includes(method)) {
                    curl += ` \\\n  -d '${body.substring(0, 200)}'`;
                }
                return curl;
            }

            // ===== SEND REQUEST =====
            async function sendRequest() {
                let url = urlInput.value.trim();
                if (!url) {
                    showToast('تکایە لینکێک بنووسە', 'error');
                    return;
                }
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }

                try { new URL(url); } catch (_) {
                    showToast('لینکەکە نادروستە', 'error');
                    setBadge('لینک نادروست', 'error');
                    return;
                }

                const method = methodSelect.value;
                const redirect = redirectSelect.value;
                const showHeaders = showHeadersCheck.checked;
                const showFull = showFullHtmlCheck.checked;

                setBadge('داواکاری دەنێردرێت...', 'loading');
                setResult('🔄 داواکاری دەنێردرێت... تکایە چاوەڕوان بە...');
                updateStats('...', null, null, '...');

                const startTime = performance.now();
                lastUrl = url;
                lastMethod = method;

                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 20000);

                    const fetchOptions = {
                        method: method,
                        headers: {
                            'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                        },
                        signal: controller.signal,
                        credentials: 'omit',
                        redirect: redirect
                    };

                    const response = await fetch(url, fetchOptions);
                    clearTimeout(timeout);

                    const endTime = performance.now();
                    const duration = Math.round(endTime - startTime);

                    const contentType = response.headers.get('content-type') || '';
                    const isHtml = contentType.includes('text/html') || contentType.includes('application/xhtml+xml');

                    let rawBody = '';
                    try {
                        rawBody = await response.text();
                    } catch (e) {
                        rawBody = 'ناتوانرێت کۆدەکە بخوێنرێتەوە';
                    }

                    let bodyText = showFull ? rawBody : rawBody.substring(0, 3000);
                    if (!showFull && rawBody.length > 3000) {
                        bodyText += '\n\n... (تریم کراوە بۆ 3000 کاراکتر)';
                    }

                    // Build result
                    let resultMsg = `[${response.status}] ${response.statusText}\n`;
                    resultMsg += '═'.repeat(50) + '\n';

                    if (showHeaders) {
                        resultMsg += '[HEADER] هێدەرەکانی وەڵام:\n';
                        response.headers.forEach((val, key) => {
                            resultMsg += `  ${key}: ${val}\n`;
                        });
                        resultMsg += '═'.repeat(50) + '\n';
                    }

                    resultMsg += `[INFO] قەبارە: ${formatBytes(rawBody.length)}\n`;
                    resultMsg += `[INFO] کاتی وەڵام: ${duration}ms\n`;
                    resultMsg += '═'.repeat(50) + '\n\n';

                    if (isHtml) {
                        resultMsg += `📄 کۆدی HTML (${showFull ? 'تەواو' : 'بەشێک'}):\n`;
                        resultMsg += bodyText;
                    } else {
                        resultMsg += `📄 کۆدی وەڵام:\n${bodyText}`;
                    }

                    // Update UI
                    if (response.status >= 200 && response.status < 400) {
                        setBadge(`✅ ${response.status} ${response.statusText}`, 'success');
                        showToast(`پاسخی ${response.status} وەرگیرا`, 'success');
                    } else {
                        setBadge(`❌ ${response.status} ${response.statusText}`, 'error');
                        showToast(`هەڵەی ${response.status}`, 'error');
                    }

                    setResult(resultMsg, response.status >= 400);
                    updateStats(
                        `${response.status} ${response.statusText}`,
                        rawBody.length,
                        duration,
                        response.headers.get('server') || '—'
                    );

                    lastResponse = {
                        url,
                        method,
                        status: response.status,
                        headers: Object.fromEntries(response.headers),
                        body: rawBody,
                        duration
                    };
                    lastHeaders = Object.fromEntries(response.headers);

                } catch (err) {
                    const endTime = performance.now();
                    const duration = Math.round(endTime - startTime);
                    let errorMsg = err.message || 'هەڵەیەکی نەناسراو';
                    if (err.name === 'AbortError') {
                        errorMsg = 'کاتی داواکاری تەواو بوو (20 چرکە)';
                    }
                    setBadge('❌ هەڵە', 'error');
                    setResult(`[ERROR] هەڵە لە داواکاری: ${errorMsg}`, true);
                    updateStats(`هەڵە: ${errorMsg}`, null, duration, '—');
                    showToast(`هەڵە: ${errorMsg}`, 'error');
                }
            }

            // ===== EVENT LISTENERS =====
            // Send button
            sendBtn.addEventListener('click', function(e) {
                e.preventDefault();
                sendRequest();
            });

            // Enter key
            urlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendRequest();
                }
            });

            // Clear button
            document.getElementById('clearBtn').addEventListener('click', function(e) {
                e.preventDefault();
                urlInput.value = '';
                setBadge('چاوەڕوانی', 'idle');
                setResult('');
                updateStats('—', null, '—', '—');
                showToast('پاک کرایەوە', 'info');
            });

            // Clear result button
            document.getElementById('clearResultBtn').addEventListener('click', function(e) {
                e.preventDefault();
                setResult('');
                updateStats('—', null, '—', '—');
                showToast('ئەنجام پاک کرایەوە', 'info');
            });

            // Copy button
            document.getElementById('copyBtn').addEventListener('click', function(e) {
                e.preventDefault();
                const text = resultContent.textContent || '';
                if (!text || text.includes('ئەنجامی داواکاری')) {
                    showToast('هیچ ئەنجامێک نییە بۆ کۆپی', 'error');
                    return;
                }
                navigator.clipboard.writeText(text).then(
                    () => showToast('کۆپی کرا!', 'success'),
                    () => {
                        const range = document.createRange();
                        range.selectNode(resultContent);
                        window.getSelection().removeAllRanges();
                        window.getSelection().addRange(range);
                        document.execCommand('copy');
                        window.getSelection().removeAllRanges();
                        showToast('کۆپی کرا!', 'success');
                    }
                );
            });

            // Copy CURL button
            document.getElementById('copyCurlBtn').addEventListener('click', function(e) {
                e.preventDefault();
                if (!lastUrl) {
                    showToast('تکایە یەکەم جار داواکارییەک بنێرە', 'error');
                    return;
                }
                const curl = generateCurl(lastUrl, lastMethod, lastHeaders, lastResponse?.body || '');
                navigator.clipboard.writeText(curl).then(
                    () => showToast('CURL کۆپی کرا!', 'success'),
                    () => showToast('ناتوانرێت کۆپی بکرێت', 'error')
                );
            });

            // Export button
            document.getElementById('exportBtn').addEventListener('click', function(e) {
                e.preventDefault();
                if (!lastResponse) {
                    showToast('تکایە یەکەم جار داواکارییەک بنێرە', 'error');
                    return;
                }
                const data = {
                    url: lastUrl,
                    method: lastMethod,
                    status: lastResponse.status,
                    headers: lastResponse.headers,
                    body: lastResponse.body?.substring(0, 1000) || '',
                    duration: lastResponse.duration,
                    timestamp: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `response_${Date.now()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
                showToast('هەناردە کرا!', 'success');
            });

            // Example button
            document.getElementById('exampleBtn').addEventListener('click', function(e) {
                e.preventDefault();
                urlInput.value = 'https://example.com/login';
                setBadge('چاوەڕوانی', 'idle');
                setResult('');
                updateStats('—', null, '—', '—');
                showToast('لینکی نموونە دانرا', 'info');
            });

            // ===== INIT =====
            setBadge('چاوەڕوانی', 'idle');
            console.log('🚀 Login Tester Pro Max loaded!');

            // Auto send example after 600ms
            setTimeout(() => {
                sendRequest();
            }, 600);

        })();
    </script>

</body>
</html>
